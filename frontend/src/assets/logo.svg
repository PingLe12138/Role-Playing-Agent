<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!--
    RPA 角色扮演 · 剧场星轨 R (Theatre Orbit R)
    环形轨 = 单线叙事的叙事循环（也是剧场环幕）；环上三点 = 在场角色；
    琥珀星 = 玩家（HITL 决策点）；中心 R 由线条构成，与 LangGraph 的
    "节点-边"图语言一致（竖笔=导演中枢，圈=角色回路，斜腿=剧情流向玩家）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa9ff" />
      <stop offset="1" stop-color="#2f66d8" />
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#bg)" />

  <!-- 叙事环轨 -->
  <circle cx="48" cy="48" r="30" stroke="#FFFFFF" stroke-opacity="0.96" stroke-width="5" fill="none" />

  <!-- 角色节点 ×3（蓝点衬入白色环轨） -->
  <circle cx="48" cy="19" r="4.6" fill="#3d78e0" />
  <circle cx="22.6" cy="62.5" r="4.6" fill="#3d78e0" />
  <circle cx="73.4" cy="62.5" r="4.6" fill="#3d78e0" />

  <!-- 玩家星（HITL 决策点，右上，三点对角对称） -->
  <path
    d="M73.1 24 L75.45 30.26 L82.14 30.56 L76.9 34.74 L78.68 41.19 L73.1 37.5 L67.52 41.19 L69.3 34.74 L64.06 30.56 L70.75 30.26 Z"
    fill="#FFC066" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" />

  <!-- 中心 R（图语言字标） -->
  <path
    d="M -10 -12 L -10 13 M -10 -12 C -3 -14 6.5 -13.5 7.5 -8 C 8.2 -3.5 4.5 -1.5 -2 -1.5 M -2 -1.5 L 8.5 13"
    stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"
    fill="none" transform="translate(48 47)" />
</svg>
