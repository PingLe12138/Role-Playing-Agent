<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- 透明版标志：用于浅色背景（文档、登录页、配置页等）。 -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8af2" />
      <stop offset="1" stop-color="#2f66d8" />
    </linearGradient>
  </defs>

  <!-- 叙事环轨 -->
  <circle cx="48" cy="48" r="30" stroke="url(#ring)" stroke-width="5.5" fill="none" stroke-linecap="round" />

  <!-- 角色节点 ×3（白心蓝圈，衬入环轨） -->
  <circle cx="48" cy="19" r="4.6" fill="#FFFFFF" stroke="#2f6fe4" stroke-width="2" />
  <circle cx="22.6" cy="62.5" r="4.6" fill="#FFFFFF" stroke="#2f6fe4" stroke-width="2" />
  <circle cx="73.4" cy="62.5" r="4.6" fill="#FFFFFF" stroke="#2f6fe4" stroke-width="2" />

  <!-- 玩家星（HITL 决策点） -->
  <path
    d="M73.1 24 L75.45 30.26 L82.14 30.56 L76.9 34.74 L78.68 41.19 L73.1 37.5 L67.52 41.19 L69.3 34.74 L64.06 30.56 L70.75 30.26 Z"
    fill="#F5A623" stroke="none" stroke-linejoin="round" />

  <!-- 中心 R（图语言字标） -->
  <path
    d="M -10 -12 L -10 13 M -10 -12 C -3 -14 6.5 -13.5 7.5 -8 C 8.2 -3.5 4.5 -1.5 -2 -1.5 M -2 -1.5 L 8.5 13"
    stroke="#2F6FE4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
    fill="none" transform="translate(48 47)" />
</svg>
