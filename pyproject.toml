[project]
name = "rpa-python"
version = "0.1.0"
description = "RPG narrative engine with LangGraph multi-agent system"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pypinyin>=0.55.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "node_modules", "frontend", ".venv", "dist"]
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "F",   # pyflakes — catches unused imports, undefined names (equivalent to Spotless removeUnusedImports)
    "I",   # isort — import ordering (equivalent to Spotless importOrder)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports allowed in re-exports

[tool.ruff.lint.isort]
known-first-party = ["RPA_langGraph", "services"]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
